name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Corona.SourceGeneration.Tests/Corona.SourceGeneration.Tests.csproj -c Release
      - run: dotnet pack src/Corona.SourceGeneration/Corona.SourceGeneration.csproj -c Release -o artifacts
      - run: dotnet restore tests/PackageConsumer/PackageConsumer.csproj --source "${{ github.workspace }}/artifacts" --source https://api.nuget.org/v3/index.json
      - run: dotnet build tests/PackageConsumer/PackageConsumer.csproj -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: artifacts/*.nupkg
